[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-shield"
version = "0.1.0"
dependencies = [
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "lxml>=5.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
    "scikit-learn>=1.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
